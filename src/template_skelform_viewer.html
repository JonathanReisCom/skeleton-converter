<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skeleton-converter skelform viewer</title>
<link rel="stylesheet" href="hud.css">
<style>
  :root { --bg: #0f0f0f; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .rig-stats { font: 10px/1.4 var(--mono); color: var(--muted); margin-top: 5px; }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<!-- crossorigin: an error inside a cross-origin classic script is reported
     as "Script error." without it, which hides exactly what a broken rig
     needs to say. jsDelivr serves these with CORS. -->
<script src="__CDN_JSZIP__" crossorigin="anonymous"></script>
<script src="__CDN_RUNTIME__" crossorigin="anonymous"></script>
<script src="__CDN_API__" crossorigin="anonymous"></script>
<script src="hud.js"></script>
<script>
// The rig is played by SkelForm's own web player runtime (skelform-js + the
// player's api.js), so this pane shows the .skf as its runtimes read it — not
// a replay through another format. Loading is async: the shell's readiness
// probe waits for previewPlay, which is defined immediately.
const SKF_URL = "__SKF_URL__";
const TITLE = "__TITLE__";
const canvas = document.getElementById("glcanvas");

let skfc = null;          // the player's per-canvas state (skfCanvases[0])
let index = new Map();    // animation name -> index

if (!window.hud) {
  // A bundle written before the shared HUD existed: the two files sit beside
  // this page, so the message is actionable instead of a blank pane.
  document.body.insertAdjacentHTML("beforeend",
    '<p style="position:fixed;left:8px;bottom:8px;color:#ff7b7b">'
    + "hud.js is missing beside this viewer — rebuild the bundle.</p>");
  window.__loadError = "hud.js missing";
  throw new Error("hud.js missing");
}
const nodes = hud.mount({ title: "skelform web" });
hud.setNote(nodes, TITLE + " · t=0.0");
hud.watchErrors(nodes);
const stats = document.createElement("div");
stats.className = "rig-stats";
nodes.box.appendChild(stats);

// The canvas needs its DRAWING BUFFER sized to its CSS box: a canvas that
// only has `width:100%` keeps the 300x150 default buffer, and the player's
// projection is built from the buffer — the rig then renders at a fraction of
// the pane. The GL glue carries those dimensions, so a resize re-runs it
// (it is a plain function in the player's API, and the loop reads skfc).
function sizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width));
  canvas.height = Math.max(1, Math.round(rect.height));
}

function regl() {
  const glue = SkfInitGl(skfc.gl, skfc.program, [0, 0, 0, 0], canvas);
  skfc.gl = glue[0]; skfc.program = glue[1];
  skfc.buffers = glue[2]; skfc.uniforms = glue[3];
  skfc.rendered = false;
}

// Fit the rig into the canvas. api.js's SkfDraw applies the camera with two
// different Y conventions: a bone becomes `pos * scale + position`, while a
// vertex — which is what a mesh visual actually draws — becomes
// `-pos.y * scale - position.y`. Framing therefore has to speak the VERTEX
// convention (negated offset); using the bone one puts the whole rig above the
// top edge, drawn and invisible (the draw calls still happen, with no error).
//
// The box is measured ONCE, on the rig's SETUP pose — the same thing the Spine
// pane frames (`skeleton.getBounds` before its AnimationState applies). Measuring
// whatever frame happened to be on screen framed a moving target: the pose that
// loads first sets the camera, every other pose then runs off the canvas. A
// later re-fit (a resize) reuses the box; it no longer depends on the clock.
let fitBounds = null;

function fit() {
  const rect = canvas.getBoundingClientRect();
  const width = Math.max(rect.width, 1), height = Math.max(rect.height, 1);
  // Measure with the camera RESET to identity: the draw loop writes the
  // camera's scale/position INTO the cached bones and vertices, so measuring
  // after a previous fit re-measured its own output — a feedback loop that
  // framed the rig off-screen. Reset -> setup pose -> construct -> measure.
  skfc.constructOptions.scale = { x: 1, y: 1 };
  skfc.constructOptions.position = { x: 0, y: 0 };
  // `SkfGenericAnimate` writes the animated values into `armature.bones`, so
  // the setup pose has to be restored from the init* mirrors the runtime itself
  // resets unanimated bones to. Without this the box is the current frame:
  // an idle frame is compact and the attack pose then hangs off the canvas.
  for (const bone of skfc.armature.bones || []) {
    if (bone.init_pos) bone.pos = { x: bone.init_pos.x, y: bone.init_pos.y };
    if (bone.init_scale) bone.scale = { x: bone.init_scale.x, y: bone.init_scale.y };
    if (typeof bone.init_rot === "number") bone.rot = bone.init_rot;
    if (typeof bone.init_hidden !== "undefined") bone.hidden = !!bone.init_hidden;
  }
  skfc.armature.cachedBones = SkfGenericConstruct(skfc.armature);
  if (!fitBounds) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const consider = (x, y) => {
      if (!isFinite(x) || !isFinite(y)) return;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
    };
    // Only what the file DRAWS: a visual hanging off a hidden bone is an
    // unequipped alternative (the writer gates them with init_hidden), and a
    // bone is a joint, not geometry — the Spine pane's own `getBounds` counts
    // setup-pose attachments only. Including either inflates the box and the
    // rig is framed smaller than the pane next to it.
    for (const bone of skfc.armature.cachedBones || []) {
      if (bone.hidden || bone.visuals_id === -1) continue;
      const visual = skfc.armature.visuals[bone.visuals_id];
      for (const vertex of (visual && visual.vertices) || []) {
        consider(vertex.pos.x, vertex.pos.y);
      }
    }
    if (minX === Infinity) {
      // A rig of region visuals has no geometry at all (the runtime draws them
      // from the style, centred on the bone), so the joints are all there is.
      for (const bone of skfc.armature.cachedBones || []) {
        if (bone.hidden) continue;
        consider(bone.pos.x, bone.pos.y);
      }
    }
    if (minX === Infinity) return;
    fitBounds = [minX, minY, maxX, maxY];
  }
  const [minX, minY, maxX, maxY] = fitBounds;
  const spanX = Math.max(maxX - minX, 1e-3), spanY = Math.max(maxY - minY, 1e-3);
  // Same call the Spine pane makes: the box and the margin are shared, only
  // the camera convention (multiply by `scale`, here) is this viewer's own. Two
  // panes that disagree frame the same geometry at different sizes, which is
  // exactly what the comparison is supposed to reveal about the RIG.
  const scale = hud.fitScale(spanX, spanY, width, height);
  const centerX = (minX + maxX) / 2, centerY = (minY + maxY) / 2;
  skfc.constructOptions.scale = { x: scale, y: scale };
  skfc.constructOptions.position = {
    x: width / 2 - centerX * scale,
    // The vertex pass computes `-y * scale - position.y`, so centring means
    // `position.y = -(centerY * scale + height / 2)`: the offset carries the
    // half-height as well as the box centre.
    y: -(centerY * scale + height / 2),
  };
  skfc.rendered = false;
  // What the camera was fitted to, readable from the DOM: the pane's own
  // instrumentation, since a canvas gives a probe nothing to assert against.
  document.body.dataset.fit = JSON.stringify({
    canvas: [width, height], scale,
    position: [skfc.constructOptions.position.x, skfc.constructOptions.position.y],
    world: fitBounds,
  });
}

function select(name) {
  const wanted = index.has(name) ? index.get(name) : 0;
  skfc.selectedAnim = wanted;
  // No blending across a switch: the other panes jump, and a smoothed switch
  // would show a pose neither engine has.
  skfc.smoothFrames = 0;
  skfc.rendered = false;
}

// Driven by the compare shell. play keeps the animation switching in one
// place; the shell seeks every frame through previewFreeze, so the pane never
// advances on its own while it is being compared (two clocks drift).
window.previewPlay = function (name) {
  if (!skfc) return;
  select(name);
  skfc.animTime = 0;
  skfc.playing = false;
  hud.mark(nodes, name);
};

window.previewFreeze = function (name, t) {
  if (!skfc) return;
  select(name);
  skfc.playing = false;
  skfc.animTime = Math.max(0, t) * 1000;
  hud.mark(nodes, name);
};

// Opened standalone (a bundle's index.html): drive it from its own clock, so
// the file is watchable without the comparison shell.
window.previewAutoplay = function () {
  if (!skfc) return;
  skfc.animTime = 0;
  skfc.playing = true;
};

// api.js's skfReadFile declares its page counter INSIDE the member loop
// (`let atlasIdx = 0; … atlasIdx++`), so the increment is dead code and every
// page image overwrites atlases[0]: a multi-page rig then samples page 0 with
// another page's rects and draws black. The archive carries all the pages, so
// read them here and fill in what the loader missed. Single-page rigs (the
// usual case) are untouched.
async function loadMissingAtlasPages(bytes) {
  const pages = skfc.armature.atlases || [];
  if (pages.length === 0) return;
  const zip = await JSZip.loadAsync(bytes);
  for (const page of pages) {
    const entry = zip.file(page.filename);
    if (!entry) continue;
    const bitmap = await createImageBitmap(
      new Blob([await entry.async("uint8array")], { type: "image/png" }));
    const gl = skfc.gl;
    page.texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, page.texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  }
  skfc.rendered = false;
}

async function start() {
  try {
    sizeCanvas();
    const bytes = await SkfDownloadSample(SKF_URL);
    await SkfInit(bytes, canvas, 30);     // 30 frames settle the physics
    skfc = skfCanvases[skfCanvases.length - 1];
    await loadMissingAtlasPages(bytes);
    // A style has to be active or nothing resolves to a texture and the
    // canvas stays empty: the player draws through the active styles, and the
    // runtime starts with none. Ours writes one ("default"), so take the first.
    // An editor-made file spreads its textures across several styles (the
    // editor toggles them); activating only the first leaves most visuals
    // without a texture. Our own bundles write a single style, so this is the
    // same thing in the common case.
    const styles = skfc.armature.styles || [];
    if (styles.length) skfc.activeStyles = styles.slice();
    // api.js's SkfDraw reads a bare global `visuals` — the five-function
    // player assumes its host page defines it, and its own example page does
    // not, so the draw loop throws "visuals is not defined" and the canvas
    // stays empty. Hand it the armature's visuals.
    window.visuals = skfc.armature.visuals;
    const animations = skfc.armature.animations || [];
    animations.forEach((animation, i) => index.set(animation.name, i));
    hud.tracks(nodes, animations.map((a) => a.name), (name) => {
      window.previewPlay(name);
    }, animations[0] ? animations[0].name : null);
    // Frame AFTER the runtime has placed the vertices: constructVerts runs per
    // frame and leaves every vert at its bind bone's world, which is the box
    // to frame. Measuring before the first frame framed the STORED local
    // coordinates instead — a box near the origin — and the rig drew at its
    // bones' real worlds, off-camera: an almost empty pane.
    requestAnimationFrame(SkfNewFrame);
    // constructVerts converges the vertices to their bind bones' worlds over
    // several smoothed frames, so the box to frame only settles after the loop
    // has run. Re-fit a bounded number of times; once the pose is frozen the
    // fit stops moving.
    let refits = 0;
    const refit = () => { if (refits++ < 12) fit(); };
    requestAnimationFrame(() => requestAnimationFrame(refit));
    setInterval(refit, 500);
    window.addEventListener("resize", () => { sizeCanvas(); regl(); fit(); });
    setInterval(() => {
      // The clock rides in the HUD's note line, with the file this pane plays.
      if (skfc) {
        hud.setNote(nodes, TITLE + " · t=" + (skfc.animTime / 1000).toFixed(1));
      }
      // What actually loaded: an archive with no active style, or textures
      // that failed to decode, draws nothing and says nothing. Guarded —
      // a diagnostic must never be the thing that breaks the pane.
      try {
        const visuals = (skfc.armature.visuals || []).length;
        // "tex n/m": how many visuals resolve to a style texture — the player
        // silently skips a visual whose name matches no active style, and the
        // rig then draws with no texture at all.
        let withTex = 0;
        for (const visual of skfc.armature.visuals || []) {
          try { if (visual.tex && SkfGenericGetBoneTexture(visual.tex, skfc.activeStyles)) withTex++; }
          catch (error) { /* lookup itself is what we are probing */ }
        }
        const atlases = skfc.armature.atlases || [];
        stats.textContent =
          skfc.armature.bones.length + " bones · " + visuals + " visuals · "
          + (skfc.armature.styles || []).length + " styles · active "
          + skfc.activeStyles.length + " · tex " + withTex + "/" + visuals
          + " · atlas " + atlases.map((a) => (a.texture ? "gl" : "none")).join(",");
      } catch (error) {
        stats.textContent = "stats failed: " + error.message;
      }
    }, 300);
    document.body.dataset.ready = "1";
    // Same handle the Spine pane publishes (window.__state): the comparison
    // shell and the verification probes read the live canvas state here.
    window.__skelform = { canvases: skfCanvases, get skfc() { return skfc; } };
    window.previewAutoplay();
  } catch (error) {
    hud.fail(nodes, "cannot play " + SKF_URL + ": "
      + (error && error.message ? error.message : error));
  }
}

start();
</script>
</body>
</html>
