<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skeleton-converter compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500;700&display=swap">
<!-- The sidebar mounts the same speed control a pane's HUD does, from the same
     ladder: two copies of "what 2x means" would be two answers to a question
     the comparison depends on. Loaded before the page's own styles so the
     shell's variables and layout win over the pane HUD's defaults. -->
<link rel="stylesheet" href="hud.css">
<script src="hud.js"></script>
<style>
  :root {
    /* The stage is the player: black, quadrant, four equal cells. Everything
       around it is the same library furniture as the studio — chips for what
       you can pick, pills for what you can do, weight for hierarchy. The pane
       field stays #0F0F0F — the page's own black — because BOTH panes clearing
       to the same colour is
       what makes a pixel comparison mean anything: that value is a contract,
       not a mood. */
    --bg: #0f0f0f; --surface: #212121; --chip: #272727; --hover: #3f3f3f;
    --border: #303030; --text: #f1f1f1; --muted: #aaa;
    --accent: #f00; --accent-soft: rgba(255, 0, 0, .14);
    --stage: #0f0f0f;
    --godot: #478cbf; --spine: #f4801f; --skelform: #8f7ee7;
    --ui: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    --brand: "Roboto Condensed", "Roboto", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* Fluid, like the studio: the sidebar's width and the type scale follow
       the window, so a 2560px screen is a wider player rather than a centered
       one with dead margins. There is no page gutter or shell here — this is an
       application, and the panes take every pixel the sidebar does not. */
    --rail: clamp(208px, 15vw, 264px);
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font: 400 14px/1.45 var(--ui); }
  a { color: inherit; text-decoration: none; }

  body { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
         height: 100vh; overflow: hidden; }

  /* ── the sidebar: flush to the edge, its own scroll, full height ──────── */
  .side { display: flex; flex-direction: column; gap: 4px; min-height: 0;
          border-right: 1px solid var(--border); padding: 16px 14px 20px;
          overflow-y: auto; scrollbar-width: thin; }
  .side .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .wordmark { font: 700 19px/1 var(--brand); letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }
  .back { background: var(--chip); border-radius: var(--radius-sm);
          padding: 7px 12px; font: 500 12.5px var(--ui); white-space: nowrap; }
  .back:hover { background: var(--hover); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .job { margin-bottom: 14px; }
  .job .title { font: 500 clamp(15px, 1.05vw, 17px)/1.25 var(--ui);
                letter-spacing: -0.005em; overflow-wrap: anywhere; }
  .job .stamp { margin-top: 4px; color: var(--muted); font: 400 11.5px/1.4 var(--mono); }
  .ctl { display: flex; align-items: center; justify-content: space-between;
         width: 100%; text-align: left; border: 0; cursor: pointer;
         background: var(--chip); color: var(--text);
         border-radius: var(--radius-sm); padding: 11px 14px;
         font: 500 clamp(13.5px, 0.95vw, 15px) var(--ui);
         transition: background .12s, color .12s; }
  .ctl:hover { background: var(--hover); }
  .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl .value { font: 400 clamp(12px, 0.8vw, 13px) var(--mono); color: var(--muted); }
  .ctl.on { background: var(--text); color: var(--bg); }
  .ctl.on .value { color: var(--bg); }
  #gridbtn .value::after { content: "on"; }
  #gridbtn.on .value::after { content: "off"; }
  .rail .label { margin: 16px 0 8px; padding: 0 2px; color: var(--muted);
                 font: 500 12px var(--ui); letter-spacing: 0.06em;
                 text-transform: uppercase; }
  .player { min-width: 0; }

  /* ── the player ───────────────────────────────────────────────────────── */
  /* The panes take everything the sidebar leaves — no fixed ratio, no frame:
     the space is the point. */
  .player { min-width: 0; min-height: 0; display: flex; }
  #stage { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr;
           grid-auto-rows: 1fr; gap: 1px; background: #000; min-width: 0; }
  .pane { position: relative; min-width: 0; min-height: 0; background: var(--stage); }
  .pane[data-empty]::before { content: ""; position: absolute; inset: 26%;
           border: 1px dashed #2b2f38; border-radius: 6px; }
  .pane[data-empty]::after { content: "no format here yet"; position: absolute;
           top: 50%; left: 50%; transform: translate(-50%, -50%);
           font: 400 11px var(--ui); letter-spacing: 0.08em; color: #565c68;
           background: var(--stage); padding: 0 10px; }

  /* Pane labels are chips, the same furniture as the studio's. */
  .pane .tag { position: absolute; top: 10px; left: 10px; z-index: 2;
               display: inline-flex; align-items: center; gap: 8px;
               white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden;
               background: rgba(15, 15, 15, .88); border-radius: var(--radius-sm);
               padding: 6px 11px; font: 500 clamp(11.5px, 0.8vw, 13px)/1 var(--ui);
               color: var(--text); }
  .pane .tag em { font-style: normal; color: var(--muted); }
  .pane .tag i { width: 7px; height: 7px; border-radius: 50%; flex: none;
                 background: var(--muted); }
  .pane[data-kind="godot"] .tag i { background: var(--godot); }
  .pane[data-kind="spine"] .tag i { background: var(--spine); }
  .pane[data-kind="skelform"] .tag i { background: var(--skelform); }
  .pane .tag u { text-decoration: none; color: var(--muted); font-weight: 400; }
  .pane[data-kind="godot"] .tag span::after { content: " · Godot 4.7"; }
  .pane[data-kind="spine"] .tag span::after { content: " · Spine 4.2"; }
  .pane[data-kind="skelform"] .tag span::after { content: " · SkelForm web"; }
  .pane[data-failed="1"] .tag span::after { content: " · not loaded"; color: #ff8a8a; }
  .pane iframe { position: absolute; inset: 0; width: 100%; height: 100%;
                 border: 0; background: transparent; }

  .grid { position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.24) 0 1px, transparent 1px 200px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.24) 0 1px, transparent 1px 200px);
    background-position: 50% 50%; }
  .crosshair { position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      linear-gradient(90deg, transparent calc(50% - .5px), rgba(255,255,255,.5) calc(50% - .5px), rgba(255,255,255,.5) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(0deg, transparent calc(50% - .5px), rgba(255,255,255,.5) calc(50% - .5px), rgba(255,255,255,.5) calc(50% + .5px), transparent calc(50% + .5px)); }

  /* ── the action bar under the player ──────────────────────────────────── */
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
             margin: 18px 0 14px; }
  .actions .title { font: 500 18px/1.2 var(--ui); letter-spacing: -0.01em;
                    margin-right: auto; }
  .action { display: inline-flex; align-items: center; gap: 8px; border: 0;
            background: var(--chip); color: var(--text); border-radius: var(--radius-sm);
            padding: 9px 15px; font: 500 13px var(--ui); cursor: pointer;
            transition: background .12s, color .12s; }
  .action:hover { background: var(--hover); }
  .action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .action .value { font: 400 12px var(--mono); color: var(--muted); }
  .action.on { background: var(--text); color: var(--bg); }
  .action.on .value { color: var(--bg); }

  /* ── chips: the animations, stacked so the list reads down ───────────── */
  #tracks { display: flex; flex-direction: column; gap: 4px; }
  /* The list sits on the page's own background in every state — no fill makes
     a row look like a different panel. The choice is marked with ink and a
     bar. */
  #tracks .track { width: 100%; text-align: left; border: 0; cursor: pointer;
                   background: var(--bg); color: var(--muted);
                   border-radius: var(--radius-sm); padding: 9px 14px;
                   box-shadow: inset 2px 0 0 transparent;
                   font: 400 clamp(13px, 0.92vw, 15px) var(--ui); white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis;
                   transition: color .12s, box-shadow .12s; }
  #tracks .track:hover { color: var(--text); }
  #tracks .track:hover { background: var(--hover); }
  #tracks .track:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tracks .track.active { background: var(--bg); color: var(--text);
                          font-weight: 500;
                          box-shadow: inset 2px 0 0 var(--accent); }
  #tracks .waiting { color: var(--muted); font: 400 13px var(--ui); padding: 9px 14px; }

  /* ── slots: the description of the panes, dense ───────────────────────── */
  .slots { margin-top: 18px; }
  .slots > summary { cursor: pointer; list-style: none; display: flex;
                     align-items: center; color: var(--muted);
                     font: 500 12px var(--ui); letter-spacing: 0.06em;
                     text-transform: uppercase; padding: 2px 0 8px; }
  .slots > summary::-webkit-details-marker { display: none; }
  .slots > summary::after { content: "show"; margin-left: auto; font-weight: 400; }
  .slots[open] > summary::after { content: "hide"; }
  .slots[open] > summary { color: var(--text); }
  .slots .row { display: flex; align-items: center; gap: 6px; padding: 6px 0;
                border-bottom: 1px solid var(--border); }
  .slots .row-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; color: var(--muted);
                     font: 400 11.5px var(--mono); }
  /* Same width for every dropdown: `max-width` sized each one to its own text,
     and `min-width: auto` let a long option push it wider. A fixed basis with
     min-width zeroed is what actually holds the column. */
  .slots select { flex: 0 0 46%; min-width: 0; font: 400 11.5px var(--ui);
                  color: var(--text); background: var(--chip); border: 0;
                  border-radius: 6px; padding: 4px 6px; cursor: pointer; }
  .slots select:hover { background: var(--hover); }
  .slots select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr);
           grid-template-rows: auto minmax(0, 1fr); }
    .side { border-right: 0; border-bottom: 1px solid var(--border);
            max-height: 52vh; }
    .side .head, .side .job { margin-bottom: 10px; }
    #tracks { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    #tracks .track { width: auto; flex: none; color: var(--text);
                     border: 1px solid var(--border);
                     box-shadow: inset 0 -2px 0 transparent; }
    #tracks .track.active { border-color: var(--hover);
                            box-shadow: inset 0 -2px 0 var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<!-- An application, not a page: one sidebar against the left edge for its
     whole height, and the panes taking every pixel that is left. -->
<aside class="side">
  <div class="head">
    <a class="wordmark" href="/">skeleton<span>·</span>compare</a>
    <a class="back" href="/">← Studio</a>
  </div>
  <div class="job">
    <div class="title" id="jobtitle">comparison</div>
    <div class="stamp" id="where"></div>
  </div>

  <button class="ctl" id="freezer" title="Freeze every pane at the same time">
    Freeze <span class="value" id="tval">t=0.0</span>
  </button>
  <button class="ctl" id="gridbtn" title="Toggle the alignment grid over every pane">
    Grid <span class="value"></span>
  </button>
  <div class="speed" id="speed"></div>

  <div class="label">Animations</div>
  <div id="tracks"><span class="waiting">loading…</span></div>

  <details class="slots" id="attachments-group" open hidden>
    <summary id="slotssummary">Slots</summary>
    <div class="rows" id="attachments"></div>
  </details>
</aside>
<main class="player"><div id="stage"></div></main>

<script>
"use strict";
// Compare shell: N typed panes (godot / spine / skelform) laid out in a
// quadrant grid — source first — with the controls under the player and the
// slots in a panel, the way a page that plays something is arranged. Each pane
// is driven through the protocol it already publishes — previewPlay/
// previewFreeze (Godot wrapper) and window.__state (Spine viewer). Iframes are
// same-origin (one http.server serves the parent folder), so the parent may
// reach into them directly.
const PANES = __PANES__;
const stage = document.getElementById("stage");
const tracksBox = document.getElementById("tracks");
const attachmentsBox = document.getElementById("attachments");
const attachmentsGroup = document.getElementById("attachments-group");
const tval = document.getElementById("tval");
const where = document.getElementById("where");
const jobtitle = document.getElementById("jobtitle");

let frozen = false;
let freezeTime = 0.0;
let currentName = null;  // shell-owned: set by play(), never guessed

// The job the page belongs to: the first pane's folder is `<n>-<role>-<name>-
// <format>`, so the name in the middle is what to show above the player.
if (PANES.length) {
  const parts = PANES[0].label.split("-");
  if (parts.length >= 4) jobtitle.textContent = parts.slice(2, -1).join("-");
  where.textContent = PANES.length + " panes · " + PANES[0].label.split("-").pop() + " first";
}

const frames = PANES.map((p, index) => {
  const pane = document.createElement("div");
  pane.className = "pane";
  pane.dataset.kind = p.kind;
  const role = /-source-/.test(p.label) ? "source" : "target";
  const label = document.createElement("div");
  label.className = "tag";
  // The panes are a sequence (the folders are numbered 1-source, 2-target…),
  // so the number is information, not decoration: it says which pane came
  // from the rig and which came from the conversion. The folder name is long
  // and lives in the tooltip.
  label.title = p.label;
  label.innerHTML = "<em>" + String(index + 1).padStart(2, "0") + "</em>"
    + "<i></i><span></span><u>" + role + "</u>";
  const iframe = document.createElement("iframe");
  iframe.src = p.url;
  const grid = document.createElement("div");
  grid.className = "grid";
  const cross = document.createElement("div");
  cross.className = "crosshair";
  pane.appendChild(label);
  pane.appendChild(iframe);
  pane.appendChild(grid);
  pane.appendChild(cross);
  stage.appendChild(pane);
  return { kind: p.kind, label: p.label, iframe, grid };
});

document.getElementById("gridbtn").onclick = (e) => {
  const on = !frames[0].grid.style.display;
  frames.forEach(f => f.grid.style.display = on ? "none" : "");
  e.currentTarget.classList.toggle("on", !on);
};
frames.forEach(f => f.grid.style.display = "");

// Quadrant grid: pad the last row so a run with fewer panes than cells keeps
// its empty quadrants instead of stretching the panes it does have.
for (let spare = frames.length; spare < Math.max(4, Math.ceil(frames.length / 2) * 2); spare += 1) {
  const cell = document.createElement("div");
  cell.className = "pane";
  cell.dataset.empty = "1";
  cell.title = "no format here yet";
  stage.appendChild(cell);
}

function whenLoaded(iframe, test, attempt) {
  attempt = attempt || 0;
  if (attempt > 300) return Promise.reject(new Error("timeout"));
  try {
    const w = iframe.contentWindow;
    if (test(w)) return Promise.resolve(w);
  } catch (e) { /* same-origin only; ignore cross-origin load */ }
  return new Promise(res => setTimeout(res, 200)).then(
    () => whenLoaded(iframe, test, attempt + 1));
}

// A pane that failed to load counts as ready: it will never publish its
// handles, and a shell still waiting for them shows "loading…" forever while
// the rig on the other side looks broken.
const ready = frames.map(f =>
  f.kind === "spine"
    ? whenLoaded(f.iframe, w => w.__loadError || (w.__state && w.__skeleton))
    : whenLoaded(f.iframe, w => w.__loadError
        || typeof w.previewPlay === "function"));
let paneReady = [];  // resolved pane windows, aligned with frames

// A pane whose assets 404'd loads, animates and never textures; it is alive
// but has no handles to drive, so every control has to step around it.
function paneAlive(i) {
  const w = paneReady[i];
  return !!w && !w.__loadError;
}

function paneAnimNames(pane) {
  // A Godot wrapper builds its track buttons from window.previewAnims and a
  // SkelForm pane builds them from the archive's animations; either way the
  // names are readable from its DOM (same origin). Read the HUD's track box
  // first: a pane's own controls are buttons too, and reading them as
  // animation names put a fake chip in the row.
  try {
    const doc = pane.iframe.contentDocument;
    const inTracks = [...doc.querySelectorAll(".hud .tracks button")];
    const buttons = inTracks.length ? inTracks : [...doc.querySelectorAll("button")];
    const names = buttons.map(b => b.textContent);
    return names.length ? names : null;
  } catch (e) { return null; }
}

// The attachment explorer: ONE row per slot, driving every pane that has that
// slot. The panes report their own slots (their runtimes are the only ones
// that know them), and the rows are merged by slot name — a slot is the same
// slot in every pane, so a select that moved one side and not the other would
// be a comparison of two different rigs. Option names are matched loosely
// across panes: Godot sanitizes what Spine keeps verbatim (`Eye_Anger` ->
// `Eye_anger`), and only the pane can name its own entry.
function slotKey(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function buildAttachments() {
  const slots = new Map();
  frames.forEach((f, i) => {
    if (!paneAlive(i)) return;
    let rows = null;
    try {
      rows = paneReady[i].__attachmentRows ? paneReady[i].__attachmentRows() : null;
    } catch (e) { return; }
    (rows || []).forEach(row => {
      const key = slotKey(row.name);
      let slot = slots.get(key);
      if (!slot) {
        slot = { name: row.name, options: [], panes: [], value: "" };
        slots.set(key, slot);
      }
      slot.panes.push(row);
      if (!slot.value && row.value) slot.value = row.value;
      (row.options || []).forEach(option => {
        if (!slot.options.some(known => slotKey(known) === slotKey(option))) {
          slot.options.push(option);
        }
      });
    });
  });

  attachmentsBox.textContent = "";
  slots.forEach(slot => {
    const line = document.createElement("div");
    line.className = "row";
    const name = document.createElement("span");
    name.className = "row-name";
    name.textContent = slot.name;
    name.title = slot.name + " — applied to every pane";
    const select = document.createElement("select");
    const none = document.createElement("option");
    none.textContent = "(none)";
    // Sem `value`, o "nenhum" vale a string "(none)" — e escolher nenhum
    // anexo não aplicava nada em painel nenhum.
    none.value = "";
    select.appendChild(none);
    slot.options.forEach(option => {
      const o = document.createElement("option");
      o.textContent = option;
      select.appendChild(o);
    });
    select.value = slot.value || "";
    select.onchange = () => {
      // Every pane gets the pick, translated into its own spelling of that
      // attachment. A pane that does not carry it is left alone rather than
      // blanked: an entry missing on one side is a conversion finding, and
      // erasing it would hide it.
      const wanted = slotKey(select.value);
      slot.panes.forEach(row => {
        if (!select.value) { row.onPick(""); return; }
        const own = (row.options || []).find(o => slotKey(o) === wanted);
        if (own) row.onPick(own);
      });
    };
    line.appendChild(name);
    line.appendChild(select);
    attachmentsBox.appendChild(line);
  });
  const summary = document.getElementById("slotssummary");
  summary.textContent = "Slots (" + slots.size + ")";
  attachmentsGroup.hidden = slots.size === 0;
}

// A pane that learns its slots late (the Godot wrapper gets them from GDScript
// once the scene is up) asks the shell to redraw them.
window.__attachmentsChanged = buildAttachments;

Promise.all(ready).then((ws) => {
  paneReady = ws;
  const spineFrame = frames.find(f => f.kind === "spine");
  let names = null;
  // A failed pane reports itself in the pane header, and its animation names
  // (if any) come from the DOM like everywhere else, so the shell still works.
  frames.forEach((f, i) => {
    if (paneReady[i] && paneReady[i].__loadError) {
      f.iframe.closest(".pane").dataset.failed = "1";
      f.iframe.closest(".pane").title = String(paneReady[i].__loadError);
    }
  });
  if (spineFrame && paneAlive(frames.indexOf(spineFrame))) {
    const w = paneReady[frames.indexOf(spineFrame)];
    names = w.__skeleton.data.animations.map(a => a.name);
  }
  if (!names) {
    for (let i = 0; i < frames.length; i += 1) {
      if (!paneAlive(i)) continue;
      names = paneAnimNames(frames[i]);
      if (names) break;
    }
  }
  buildAttachments();
  if (!names) { tracksBox.textContent = "(waiting for animation names)"; return; }
  tracksBox.textContent = "";
  names.forEach(name => {
    const b = document.createElement("button");
    b.className = "track";
    b.textContent = name;
    b.onclick = () => play(name, b);
    tracksBox.appendChild(b);
  });
  // The panes autoplay their own first animation, so the shell starts on the
  // same one — and starting is the point: with no clock running every pane
  // free-runs, and three real-time clocks with different phases and frame
  // rates read as three different speeds. play() also seeks them all to the
  // same t, so the first compared frame is already aligned.
  const playing = frames.map((f) => {
    try {
      const active = f.iframe.contentDocument
        .querySelector(".hud .tracks button.active");
      return active && active.textContent;
    } catch (e) { return null; }
  }).find(Boolean);
  if (playing) {
    const button = [...tracksBox.querySelectorAll("button")]
      .find(b => b.textContent === playing);
    if (button) play(playing, button);
  }
  // Pane HUD buttons drive the shell too: clicking a track inside either
  // pane switches everything (row + other pane) so no pane can end
  // up on a different animation from the rest.
  frames.forEach((f, i) => {
    try {
      f.iframe.contentDocument.querySelectorAll("button").forEach(b => {
        b.addEventListener("click", () => {
          const shellBtn = [...tracksBox.querySelectorAll("button")]
            .find(x => x.textContent === b.textContent);
          if (shellBtn) play(b.textContent, shellBtn);
        });
      });
    } catch (e) { /* pane not ready */ }
  });
});

function clearActive() {
  [...tracksBox.querySelectorAll("button")].forEach(b => b.classList.remove("active"));
}

// Master clock: the two engines free-run on independent clocks, so live
// playback drifts and every instant shows different poses. The shell owns
// the time: it seeks BOTH panes to the same t every animation frame, making
// the comparison deterministic instead of a race between two clocks.
//
// `base` is the animation time the clock started from, so the speed control
// can re-anchor mid-playback (base = where we are now) instead of rebuilding
// the start — which would jump the rig forward by whatever it had played.
let masterClock = null;   // { name, start, base }
let speedValue = 1;
function clockTime() {
  return masterClock.base
    + (performance.now() - masterClock.start) / 1000 * speedValue;
}

// One control, one ladder (hud.js owns it), driving the same clock every pane
// is seeked from — so a slow pass over a jump stays frame-aligned across panes
// by construction, not by three runtimes agreeing.
hud.speedRow(document.getElementById("speed"), (value) => {
  if (masterClock) masterClock = { name: masterClock.name, start: performance.now(), base: clockTime() };
  speedValue = value;
}, 1);

function seekAll(name, t) {
  frames.forEach((f, i) => {
    if (!paneAlive(i)) return;  // a pane with no handles cannot be seeked
    // Godot and SkelForm panes both take (animation, seconds) directly; the
    // Spine pane is driven through its own AnimationState.
    if (f.kind === "godot" || f.kind === "skelform") paneReady[i].previewFreeze(name, t);
    else freezeSpineAt(name, t, paneReady[i].__state, paneReady[i].__skeleton);
  });
}

function tickMaster() {
  if (masterClock === null || frozen) { masterClock = null; return; }
  seekAll(masterClock.name, clockTime());
  requestAnimationFrame(tickMaster);
}

function play(name, button) {
  currentName = name;
  clearActive();
  if (button) button.classList.add("active");
  // Switch animations on BOTH panes: the spine pane must setAnimation (its
  // freeze only seeks the CURRENT entry — seeking without switching keeps
  // the previous animation playing under a new name), and mixing must be
  // disabled or poses blend across the switch.
  frames.forEach((f, i) => {
    if (f.kind === "spine") {
      if (!paneAlive(i)) return;
      const state = paneReady[i].__state;
      state.data.defaultMix = 0;
      const entry = state.setAnimation(0, name, true);
      // setAnimation replaces the frozen entry with a fresh timeScale=1 one;
      // a frozen switch must re-apply the freeze or the spine pane keeps
      // animating while godot waits at the freeze time.
      if (frozen) {
        entry.timeScale = 0;
        entry.trackTime = freezeTime;
      }
    }
  });
  syncPaneButtons(name);
  // Frozen: sample the NEW animation at the current freeze time — seeking
  // to 0.0 would show the setup pose on one pane and mid-stride on the
  // other (the exact "head/hands wrong, feet fine" mismatch).
  masterClock = { name, start: performance.now(), base: frozen ? freezeTime : 0.0 };
  seekAll(name, frozen ? freezeTime : 0.0);
  if (!frozen) requestAnimationFrame(tickMaster);
}

// The panes have their own HUD track buttons; when the shell switches the
// animation, highlight the same button inside every pane so the HUDs never
// contradict what is playing.
function syncPaneButtons(name) {
  frames.forEach(f => {
    try {
      f.iframe.contentDocument.querySelectorAll("button").forEach(b => {
        b.classList.toggle("active", b.textContent === name);
      });
    } catch (e) { /* not ready yet */ }
  });
}

function freezeSpineAt(name, t, state, sk) {
  const entry = state.getCurrent(0);
  if (entry) {
    entry.timeScale = 0;
    // spine-ts exposes the animation as a property; getAnimation() throws
    // and kills the master clock's rAF chain.
    const duration = entry.animation.duration;
    entry.trackTime = duration > 0 ? (t % duration) : t;
  }
  state.update(0); state.apply(sk);
  sk.update(0); sk.updateWorldTransform(1);
}

document.getElementById("freezer").onclick = () => {
  frozen = !frozen;
  document.getElementById("freezer").classList.toggle("on", frozen);
  const name = currentName || (tracksBox.querySelector("button.active") || {}).textContent;
  if (frozen) {
    // Kill the master clock FIRST: a pending requestAnimationFrame would
    // fire one more previewFreeze — which plays → seeks → pauses, and Godot
    // advances between the seek and the next call (the Spine pane stayed
    // still while Godot kept walking).
    const deadClock = masterClock;
    // Read the time BEFORE dropping the clock: clockTime() needs it, and the
    // clock has to die before the next rAF fires.
    const at = deadClock ? clockTime() : freezeTime + 0.3;
    masterClock = null;
    freezeTime = Math.round(at * 10) / 10;
    tval.textContent = "t=" + freezeTime.toFixed(1);
    // Let the in-flight frame drain, then freeze once, deterministically.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => seekAll(name, freezeTime));
    });
    return;
  }
  // resume: restart the master clock from the frozen time
  masterClock = { name, start: performance.now(), base: freezeTime };
  requestAnimationFrame(tickMaster);
};
</script>
</body>
</html>
