<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skeleton-converter compare</title>
<style>
  :root {
    --bg: #16181f; --surface: #22252e; --border: #343946;
    --text: #e8eaf0; --muted: #9aa3b5;
    --godot: #478cbf; --spine: #f4801f; --skelform: #8f7ee7;
    --freeze: #e6a23c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  /* One sidebar owns every control; the stage is only panes. A control that
     lives in two places is a control that can disagree with itself. */
  body { display: flex; }
  #side { flex: none; width: 238px; box-sizing: border-box; padding: 10px;
          background: var(--surface); border-right: 1px solid var(--border);
          overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  #side .brand { font-family: var(--mono); font-size: 12px; font-weight: 700;
                 letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #side .brand em { font-style: normal; color: var(--text); }
  #side .group { display: flex; flex-direction: column; gap: 4px; }
  #side .group-title { font: 10px var(--mono); letter-spacing: .12em;
                       text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  button { font: 12px var(--mono); padding: 4px 12px; border-radius: 999px;
           border: 1px solid var(--border); background: transparent;
           color: var(--muted); cursor: pointer; letter-spacing: .02em;
           transition: background .12s, color .12s, border-color .12s; }
  button:hover { color: var(--text); border-color: #4a5164; }
  button:focus-visible { outline: 2px solid var(--freeze); outline-offset: 1px; }
  button.active { background: var(--text); border-color: var(--text);
                  color: var(--bg); font-weight: 700; }
  #freezer { border-color: var(--freeze); color: var(--freeze); font-weight: 700; }
  #freezer:hover { background: rgba(230,162,60,.12); color: var(--freeze); }
  #freezer.active { background: var(--freeze); border-color: var(--freeze); color: #16181f; }
  #freezer.active #tval { color: #16181f; }
  #gridbtn { padding: 4px 10px; }
  #gridbtn.active { background: transparent; border-color: var(--freeze);
                    color: var(--freeze); font-weight: 400; }
  /* Animation buttons stack: one per line, full width, left aligned — a list
     you scan, not a row you hunt through. */
  #tracks { display: flex; flex-direction: column; gap: 3px; }
  #tracks button { width: 100%; text-align: left; border-radius: 8px; }
  #attachments { display: flex; flex-direction: column; gap: 8px; }
  #attachments details > summary { cursor: pointer; list-style: none; }
  #attachments details > summary::-webkit-details-marker { display: none; }
  #attachments details[open] > summary { color: var(--text); }
  #attachments .row { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
  #attachments .row-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
                           white-space: nowrap; color: var(--muted);
                           font-family: var(--mono); font-size: 10px; }
  #attachments select { flex: 0 0 auto; max-width: 110px; font: 10px var(--mono);
                        background: var(--bg); color: var(--text);
                        border: 1px solid var(--border); border-radius: 7px;
                        padding: 2px 6px; cursor: pointer; }
  #attachments select:hover { border-color: #4a5164; }
  #attachments select:focus-visible { outline: 2px solid var(--freeze); outline-offset: 1px; }
  /* Quadrant grid: two columns, one row per pair of panes, so each pane gets
     the same box and the alignment grid/crosshair means the same thing in
     every one of them. A run with fewer panes than cells keeps the empty
     quadrant (the fourth format is still to come) instead of stretching the
     others into a single tall strip. */
  #stage { flex: 1 1 auto; min-width: 0; display: grid;
           grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr;
           gap: 1px; background: #000; }
  .pane { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
  .pane[data-empty]::after { content: "empty"; position: absolute; top: 50%; left: 50%;
           transform: translate(-50%, -50%); font: 11px var(--mono);
           letter-spacing: .18em; text-transform: uppercase; color: #2b303c; }
  .pane .tag { position: absolute; top: 10px; left: 10px; z-index: 2;
               display: flex; align-items: center; gap: 7px;
               background: rgba(12,14,19,.78); border: 1px solid var(--border);
               padding: 4px 11px 4px 9px; border-radius: 999px;
               font: 11px var(--mono); letter-spacing: .05em; pointer-events: none;
               text-transform: uppercase; color: var(--text); }
  .pane .tag i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pane[data-kind="godot"] .tag i { background: var(--godot); }
  .pane[data-kind="spine"] .tag i { background: var(--spine); }
  .pane[data-kind="skelform"] .tag i { background: var(--skelform); }
  .pane[data-kind="godot"] .tag span { color: #8db8d8; }
  .pane[data-kind="spine"] .tag span { color: #f0b27a; }
  .pane[data-kind="skelform"] .tag span { color: #b9aef2; }
  .pane[data-kind="godot"] .tag span::after { content: " · Godot 4.7"; }
  .pane[data-kind="spine"] .tag span::after { content: " · Spine 4.2"; }
  .pane[data-kind="skelform"] .tag span::after { content: " · SkelForm web"; }
  .pane[data-failed="1"] .tag span::after { content: " · not loaded"; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%;
           border: 0; background: transparent; }
  /* Alignment grid: identical spacing over every pane, so a feature at the
     same screen position in any two panes sits on the same line. */
  .grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(0deg, rgba(120,200,255,.25) 0 1px, transparent 1px 200px),
      repeating-linear-gradient(90deg, rgba(120,200,255,.25) 0 1px, transparent 1px 200px);
    background-position: 50% 50%;
  }
  .crosshair {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      linear-gradient(90deg, transparent calc(50% - 0.5px), rgba(255,140,80,.5) calc(50% - 0.5px), rgba(255,140,80,.5) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
      linear-gradient(0deg, transparent calc(50% - 0.5px), rgba(255,140,80,.5) calc(50% - 0.5px), rgba(255,140,80,.5) calc(50% + 0.5px), transparent calc(50% + 0.5px));
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<aside id="side">
  <div class="brand">skeleton·<em>compare</em></div>
  <div class="group">
    <button id="freezer" title="Freeze every pane at the same time">◆ t=<span id="tval">0.0</span></button>
    <button id="gridbtn" title="Toggle the alignment grid over every pane" class="active">⊞ grid</button>
  </div>
  <div class="group">
    <div class="group-title">animations</div>
    <div id="tracks">loading…</div>
  </div>
  <div class="group" id="attachments-group" hidden>
    <div class="group-title">attachments</div>
    <div id="attachments"></div>
  </div>
</aside>
<div id="stage"></div>
<script>
"use strict";
// Compare shell: N typed panes (godot / spine / skelform) laid out in a
// quadrant grid — source first — with every control in the left sidebar. Each
// pane is driven through the protocol it already publishes — previewPlay/
// previewFreeze (Godot wrapper) and window.__state (Spine viewer). Iframes are
// same-origin (one http.server serves the parent folder), so the parent may
// reach into them directly.
const PANES = __PANES__;
const stage = document.getElementById("stage");
const tracksBox = document.getElementById("tracks");
const attachmentsBox = document.getElementById("attachments");
const attachmentsGroup = document.getElementById("attachments-group");
const tval = document.getElementById("tval");

let frozen = false;
let freezeTime = 0.0;
let currentName = null;  // shell-owned: set by play(), never guessed

const frames = PANES.map(p => {
  const pane = document.createElement("div");
  pane.className = "pane";
  pane.dataset.kind = p.kind;
  const label = document.createElement("div");
  label.className = "tag";
  label.innerHTML = "<i></i><span>" + p.label.replace(/</g, "&lt;") + "</span>";
  const iframe = document.createElement("iframe");
  iframe.src = p.url;
  const grid = document.createElement("div");
  grid.className = "grid";
  const cross = document.createElement("div");
  cross.className = "crosshair";
  pane.appendChild(label);
  pane.appendChild(iframe);
  pane.appendChild(grid);
  pane.appendChild(cross);
  stage.appendChild(pane);
  return { kind: p.kind, label: p.label, iframe, grid };
});

document.getElementById("gridbtn").onclick = (e) => {
  const on = !frames[0].grid.style.display;
  frames.forEach(f => f.grid.style.display = on ? "none" : "");
  e.currentTarget.classList.toggle("active", !on);
};
// start with the grid visible
frames.forEach(f => f.grid.style.display = "");

// Quadrant grid: pad the last row so a run with fewer panes than cells keeps
// its empty quadrants instead of stretching the panes it does have.
for (let spare = frames.length; spare < Math.max(4, Math.ceil(frames.length / 2) * 2); spare += 1) {
  const cell = document.createElement("div");
  cell.className = "pane";
  cell.dataset.empty = "1";
  cell.title = "no format here yet";
  stage.appendChild(cell);
}

function whenLoaded(iframe, test, attempt) {
  attempt = attempt || 0;
  if (attempt > 300) return Promise.reject(new Error("timeout"));
  try {
    const w = iframe.contentWindow;
    if (test(w)) return Promise.resolve(w);
  } catch (e) { /* same-origin only; ignore cross-origin load */ }
  return new Promise(res => setTimeout(res, 200)).then(
    () => whenLoaded(iframe, test, attempt + 1));
}

// A pane that failed to load counts as ready: it will never publish its
// handles, and a shell still waiting for them shows "loading…" forever while
// the rig on the other side looks broken.
const ready = frames.map(f =>
  f.kind === "spine"
    ? whenLoaded(f.iframe, w => w.__loadError || (w.__state && w.__skeleton))
    : whenLoaded(f.iframe, w => w.__loadError
        || typeof w.previewPlay === "function"));
let paneReady = [];  // resolved pane windows, aligned with frames

// A pane whose assets 404'd loads, animates and never textures; it is alive
// but has no handles to drive, so every control has to step around it.
function paneAlive(i) {
  const w = paneReady[i];
  return !!w && !w.__loadError;
}

function paneAnimNames(pane) {
  // A Godot wrapper builds its track buttons from window.previewAnims and a
  // SkelForm pane builds them from the archive's animations; either way the
  // names are readable from its DOM (same origin). Read the HUD's track box
  // first: a pane's own controls ("attachments") are buttons too, and reading
  // them as animation names put a fake track in the shell's bar.
  try {
    const doc = pane.iframe.contentDocument;
    const inTracks = [...doc.querySelectorAll(".hud .tracks button")];
    const buttons = inTracks.length ? inTracks : [...doc.querySelectorAll("button")];
    const names = buttons.map(b => b.textContent);
    return names.length ? names : null;
  } catch (e) { return null; }
}

// The attachment explorer, in the sidebar: ONE row per slot, driving every
// pane that has that slot. The panes report their own slots (their runtimes are
// the only ones that know them), and the rows are merged by slot name — a slot
// is the same slot in every pane, so a select that moved one side and not the
// other would be a comparison of two different rigs. Option names are matched
// loosely across panes: Godot sanitizes what Spine keeps verbatim
// (`Eye_Anger` -> `Eye_anger`), and only the pane can name its own entry.
function slotKey(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function buildAttachments() {
  const slots = new Map();
  frames.forEach((f, i) => {
    if (!paneAlive(i)) return;
    let rows = null;
    try {
      rows = paneReady[i].__attachmentRows ? paneReady[i].__attachmentRows() : null;
    } catch (e) { return; }
    (rows || []).forEach(row => {
      const key = slotKey(row.name);
      let slot = slots.get(key);
      if (!slot) {
        slot = { name: row.name, options: [], panes: [], value: "" };
        slots.set(key, slot);
      }
      slot.panes.push(row);
      if (!slot.value && row.value) slot.value = row.value;
      (row.options || []).forEach(option => {
        if (!slot.options.some(known => slotKey(known) === slotKey(option))) {
          slot.options.push(option);
        }
      });
    });
  });

  attachmentsBox.textContent = "";
  const group = document.createElement("details");
  group.open = true;
  const title = document.createElement("summary");
  title.className = "group-title";
  title.textContent = "slots (" + slots.size + ")";
  group.appendChild(title);

  slots.forEach(slot => {
    const line = document.createElement("div");
    line.className = "row";
    const name = document.createElement("span");
    name.className = "row-name";
    name.textContent = slot.name;
    name.title = slot.name + " — applied to every pane";
    const select = document.createElement("select");
    const none = document.createElement("option");
    none.textContent = "(none)";
    // Sem `value`, o "nenhum" vale a string "(none)" — e escolher nenhum
    // anexo não aplicava nada em painel nenhum.
    none.value = "";
    select.appendChild(none);
    slot.options.forEach(option => {
      const o = document.createElement("option");
      o.textContent = option;
      select.appendChild(o);
    });
    select.value = slot.value || "";
    select.onchange = () => {
      // Every pane gets the pick, translated into its own spelling of that
      // attachment. A pane that does not carry it is left alone rather than
      // blanked: an entry missing on one side is a conversion finding, and
      // erasing it would hide it.
      const wanted = slotKey(select.value);
      slot.panes.forEach(row => {
        if (!select.value) { row.onPick(""); return; }
        const own = (row.options || []).find(o => slotKey(o) === wanted);
        if (own) row.onPick(own);
      });
    };
    line.appendChild(name);
    line.appendChild(select);
    group.appendChild(line);
  });
  attachmentsBox.appendChild(group);
  attachmentsGroup.hidden = slots.size === 0;
}

// A pane that learns its slots late (the Godot wrapper gets them from GDScript
// once the scene is up) asks the shell to redraw them.
window.__attachmentsChanged = buildAttachments;

Promise.all(ready).then((ws) => {
  paneReady = ws;
  const spineFrame = frames.find(f => f.kind === "spine");
  let names = null;
  // A failed pane reports itself in the pane header, and its animation names
  // (if any) come from the DOM like everywhere else, so the shell still works.
  frames.forEach((f, i) => {
    if (paneReady[i] && paneReady[i].__loadError) {
      f.iframe.closest(".pane").dataset.failed = "1";
      f.iframe.closest(".pane").title = String(paneReady[i].__loadError);
    }
  });
  if (spineFrame && paneAlive(frames.indexOf(spineFrame))) {
    const w = paneReady[frames.indexOf(spineFrame)];
    names = w.__skeleton.data.animations.map(a => a.name);
  }
  if (!names) {
    for (let i = 0; i < frames.length; i += 1) {
      if (!paneAlive(i)) continue;
      names = paneAnimNames(frames[i]);
      if (names) break;
    }
  }
  buildAttachments();
  if (!names) { tracksBox.textContent = "(waiting for animation names)"; return; }
  tracksBox.textContent = "";
  names.forEach(name => {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => play(name, b);
    tracksBox.appendChild(b);
  });
  // Pane HUD buttons drive the shell too: clicking a track inside either
  // pane switches everything (shell bar + other pane) so no pane can end
  // up on a different animation from the rest.
  frames.forEach((f, i) => {
    try {
      f.iframe.contentDocument.querySelectorAll("button").forEach(b => {
        b.addEventListener("click", () => {
          const shellBtn = [...tracksBox.querySelectorAll("button")]
            .find(x => x.textContent === b.textContent);
          if (shellBtn) play(b.textContent, shellBtn);
        });
      });
    } catch (e) { /* pane not ready */ }
  });
});

function clearActive() {
  [...tracksBox.querySelectorAll("button")].forEach(b => b.classList.remove("active"));
}

// Master clock: the two engines free-run on independent clocks, so live
// playback drifts and every instant shows different poses. The shell owns
// the time: it seeks BOTH panes to the same t every animation frame, making
// the comparison deterministic instead of a race between two clocks.
let masterClock = null;   // { name, start }
function seekAll(name, t) {
  frames.forEach((f, i) => {
    if (!paneAlive(i)) return;  // a pane with no handles cannot be seeked
    // Godot and SkelForm panes both take (animation, seconds) directly; the
    // Spine pane is driven through its own AnimationState.
    if (f.kind === "godot" || f.kind === "skelform") paneReady[i].previewFreeze(name, t);
    else freezeSpineAt(name, t, paneReady[i].__state, paneReady[i].__skeleton);
  });
}

function tickMaster() {
  if (masterClock === null || frozen) { masterClock = null; return; }
  const t = (performance.now() - masterClock.start) / 1000;
  seekAll(masterClock.name, t);
  requestAnimationFrame(tickMaster);
}

function play(name, button) {
  currentName = name;
  clearActive();
  if (button) button.classList.add("active");
  // Switch animations on BOTH panes: the spine pane must setAnimation (its
  // freeze only seeks the CURRENT entry — seeking without switching keeps
  // the previous animation playing under a new name), and mixing must be
  // disabled or poses blend across the switch.
  frames.forEach((f, i) => {
    if (f.kind === "spine") {
      if (!paneAlive(i)) return;
      const state = paneReady[i].__state;
      state.data.defaultMix = 0;
      const entry = state.setAnimation(0, name, true);
      // setAnimation replaces the frozen entry with a fresh timeScale=1 one;
      // a frozen switch must re-apply the freeze or the spine pane keeps
      // animating while godot waits at the freeze time.
      if (frozen) {
        entry.timeScale = 0;
        entry.trackTime = freezeTime;
      }
    }
  });
  syncPaneButtons(name);
  // Frozen: sample the NEW animation at the current freeze time — seeking
  // to 0.0 would show the setup pose on one pane and mid-stride on the
  // other (the exact "head/hands wrong, feet fine" mismatch).
  masterClock = { name, start: performance.now() - (frozen ? freezeTime : 0.0) * 1000 };
  seekAll(name, frozen ? freezeTime : 0.0);
  if (!frozen) requestAnimationFrame(tickMaster);
}

// The panes have their own HUD track buttons; when the shell switches the
// animation, highlight the same button inside every pane so the HUDs never
// contradict what is playing.
function syncPaneButtons(name) {
  frames.forEach(f => {
    try {
      f.iframe.contentDocument.querySelectorAll("button").forEach(b => {
        b.classList.toggle("active", b.textContent === name);
      });
    } catch (e) { /* not ready yet */ }
  });
}

function freezeSpineAt(name, t, state, sk) {
  const entry = state.getCurrent(0);
  if (entry) {
    entry.timeScale = 0;
    // spine-ts exposes the animation as a property; getAnimation() throws
    // and kills the master clock's rAF chain.
    const duration = entry.animation.duration;
    entry.trackTime = duration > 0 ? (t % duration) : t;
  }
  state.update(0); state.apply(sk);
  sk.update(0); sk.updateWorldTransform(1);
}

document.getElementById("freezer").onclick = () => {
  frozen = !frozen;
  document.getElementById("freezer").classList.toggle("active", frozen);
  const name = currentName || (tracksBox.querySelector("button.active") || {}).textContent;
  if (frozen) {
    // Kill the master clock FIRST: a pending requestAnimationFrame would
    // fire one more previewFreeze — which plays → seeks → pauses, and Godot
    // advances between the seek and the next call (the Spine pane stayed
    // still while Godot kept walking).
    const deadClock = masterClock;
    masterClock = null;
    if (deadClock) {
      // freezing mid-playback: capture the current master time
      freezeTime = Math.round((performance.now() - deadClock.start) / 1000 * 10) / 10;
    } else {
      freezeTime = Math.round((freezeTime + 0.3) * 10) / 10;
    }
    tval.textContent = freezeTime.toFixed(1);
    // Let the in-flight frame drain, then freeze once, deterministically.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => seekAll(name, freezeTime));
    });
    return;
  }
  // resume: restart the master clock from the frozen time
  masterClock = { name, start: performance.now() - freezeTime * 1000 };
  requestAnimationFrame(tickMaster);
};
</script>
</body>
</html>
