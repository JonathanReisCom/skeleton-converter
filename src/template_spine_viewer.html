<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skeleton-converter viewer</title>
<style>
  :root {
    --bg: #16181f; --surface: rgba(12,14,19,.78); --border: #343946;
    --text: #e8eaf0; --muted: #9aa3b5;
    --spine: #f4801f; --freeze: #e6a23c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: 44px; left: 10px; z-index: 2;
    font: 13px/1.5 system-ui, sans-serif; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 9px 12px;
  }
  #hud .label { font: 11px var(--mono); letter-spacing: .06em;
                text-transform: uppercase; color: #f0b27a; margin-bottom: 6px; }
  #hud .label b { color: var(--text); font-weight: 400; text-transform: none;
                  letter-spacing: 0; }
  #hud button {
    font: 12px var(--mono); margin-right: 4px; margin-bottom: 4px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  #hud button:hover { color: var(--text); border-color: #4a5164; }
  #hud button:focus-visible { outline: 2px solid var(--freeze); outline-offset: 1px; }
  #hud button.active { background: var(--text); color: #16181f;
                       border-color: var(--text); font-weight: 700; }
  #error { color: #ff7b7b; white-space: pre-wrap; }
  #slots {
    position: fixed; top: 82px; right: 10px; z-index: 2;
    font: 12px/1.4 system-ui, sans-serif; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 9px 12px;
    max-height: 90vh; overflow: auto; width: 260px;
  }
  #slots .row { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  #slots .slot-name {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--muted);
    font-family: var(--mono); font-size: 11px;
  }
  #slots select {
    flex: 0 0 auto; max-width: 140px; font: 11px var(--mono);
    background: #22252e; color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 3px 8px; cursor: pointer;
  }
  #slots select:hover { border-color: #4a5164; }
  #slots select:focus-visible { outline: 2px solid var(--freeze); outline-offset: 1px; }
  #slots-toggle {
    position: fixed; top: 44px; right: 10px; z-index: 3;
    font: 11px var(--mono); letter-spacing: .05em; text-transform: uppercase;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 13px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  #slots-toggle:hover { color: var(--text); border-color: #4a5164; }
  #slots-toggle:focus-visible { outline: 2px solid var(--freeze); outline-offset: 1px; }
  #slots-toggle.active { background: var(--text); color: #16181f;
                         border-color: var(--text); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { #hud button { transition: none; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div class="label"><b>spine 4.2</b> · <span id="name">…</span></div>
  <div id="tracks" style="white-space: nowrap"></div>
  <div id="error"></div>
</div>
<button id="slots-toggle" title="Toggle attachment explorer">attachments</button>
<div id="slots" hidden></div>
<script src="__RUNTIME_URL__"></script>
<script>
"use strict";
// Skeleton: ?skeleton=<name>.json wins; otherwise the default baked into this
// shell at generation time. The first animation autoplays.
const SKELETON_URL = new URLSearchParams(location.search).get("skeleton")
  || "__DEFAULT_SKELETON__";
// The atlas name does not always mirror the JSON's (hero-pro.json ships with
// hero.atlas), so use the one resolved at generation time, then fall back to
// the same-stem guess for ?skeleton= overrides.
const ATLAS_URL = new URLSearchParams(location.search).get("atlas")
  || "__DEFAULT_ATLAS__"
  || SKELETON_URL.replace(/\.json$/, ".atlas");
const FIRST_ANIMATION = "__FIRST_ANIMATION__";

const canvas = document.getElementById("canvas");
const errorBox = document.getElementById("error");
const tracksBox = document.getElementById("tracks");
const nameBox = document.getElementById("name");
let state = null, skeleton = null, activeButton = null;

window.addEventListener("error", e => {
  errorBox.textContent += (e.message || e.error) + "\\n";
});

function showTracks(animStateData) {
  const names = animStateData.skeletonData.animations.map(a => a.name);
  names.forEach(name => {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => setAnimation(name, b);
    tracksBox.appendChild(b);
    if (name === FIRST_ANIMATION) setAnimation(name, b);
  });
}

function setAnimation(name, button) {
  if (activeButton) activeButton.classList.remove("active");
  if (button) button.classList.add("active");
  activeButton = button;
  state.setAnimation(0, name, true);
}

// Attachment explorer: the editor-equivalent control per slot. Lists every
// attachment any skin maps to the slot (keyed by slot index) plus "(none)".
// Some rigs (template dummies) leave color objects unequipped — setup is
// None and no attachment timeline equips them; this panel lets the user
// toggle them like the Spine Editor's slot checkboxes.
function showAttachments(skeleton) {
  const box = document.getElementById("slots");
  const toggle = document.getElementById("slots-toggle");
  const render = () => {
    box.hidden = !box.hidden;
    toggle.classList.toggle("active", !box.hidden);
  };
  toggle.onclick = render;
  box.innerHTML = "";
  const skins = skeleton.data.skins || [];
  skeleton.slots.forEach(slot => {
    const idx = slot.data.index;
    const names = new Set();
    skins.forEach(skin => {
      const map = skin.attachments && skin.attachments[idx];
      if (map) Object.keys(map).forEach(n => names.add(n));
    });
    if (!names.size) return;
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("span");
    label.className = "slot-name";
    label.textContent = slot.data.name;
    label.title = slot.data.name;
    const sel = document.createElement("select");
    const none = document.createElement("option");
    none.textContent = "(none)";
    sel.appendChild(none);
    [...names].sort().forEach(n => {
      const o = document.createElement("option");
      o.textContent = n;
      sel.appendChild(o);
    });
    sel.value = slot.attachment ? slot.attachment.name : "";
    sel.onchange = () => {
      const att = sel.value
        ? skeleton.data.defaultSkin.getAttachment(idx, sel.value) : null;
      slot.setAttachment(att);
    };
    row.appendChild(label);
    row.appendChild(sel);
    box.appendChild(row);
  });
}

new spine.SpineCanvas(canvas, {
  pathPrefix: "",
  webglConfig: { alpha: true },
  app: {
    loadAssets: (app) => {
      if (!SKELETON_URL || !SKELETON_URL.endsWith(".json")) {
        errorBox.textContent =
          "No skeleton found. Open with ?skeleton=<name>.json";
        return;
      }
      app.assetManager.loadTextureAtlas(ATLAS_URL);
      app.assetManager.loadJson(SKELETON_URL);
    },
    initialize: (app) => {
      const assetManager = app.assetManager;
      const atlas = assetManager.get(ATLAS_URL);
      const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas));
      skeleton = new spine.Skeleton(json.readSkeletonData(assetManager.get(SKELETON_URL)));
      nameBox.textContent = SKELETON_URL;

      state = new spine.AnimationState(new spine.AnimationStateData(skeleton.data));
      state.apply(skeleton);
      skeleton.update(0);
      skeleton.updateWorldTransform(spine.Physics.update);
      // Debug handles: the verification rule in AGENTS.md samples these from a
      // running page to prove the rig animates. Keep the names stable.
      window.__skeleton = skeleton;
      window.__state = state;
      window.__renderer = app.renderer;

      const camera = app.renderer.camera;
      // Frame the skeleton from its real setup-pose bounds. The ortho camera
      // multiplies the viewport by zoom; the max ratio fits both axes with margin.
      const offset = new spine.Vector2(), size = new spine.Vector2();
      skeleton.getBounds(offset, size);
      camera.position.set(offset.x + size.x / 2, offset.y + size.y / 2, 0);
      camera.zoom = Math.max(size.x / canvas.clientWidth, size.y / canvas.clientHeight) * 1.2;

      showTracks(state.data);
      showAttachments(skeleton);
      // Premultiplied-alpha atlases (pma:true) need the flag on the renderer
      // or regions sample washed; non-PMA atlases (the default) are unchanged.
      app.renderer.premultipliedAlpha =
        (atlas.pages || []).some(p => p.pma);
    },
    update: (app, delta) => {
      if (state) {
        state.update(delta);
        state.apply(skeleton);
      }
      if (skeleton) {
        // Skeleton.update(delta) only advances the clock (this.time += delta).
        // The pose stays frozen in the world until updateWorldTransform runs,
        // so without this the rig renders a static setup pose while the
        // animation state happily advances.
        skeleton.update(delta);
        skeleton.updateWorldTransform(spine.Physics.update);
      }
    },
    render: (app) => {
      if (!skeleton) return;
      app.renderer.resize(spine.ResizeMode.Expand);
      const gl = app.renderer.context.gl;
      gl.clearColor(0.118, 0.129, 0.161, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      app.renderer.begin();
      app.renderer.drawSkeleton(skeleton, true);
      app.renderer.end();
    },
    error: (app, errors) => {
      errorBox.textContent = Object.entries(errors)
        .map(([path, msg]) => path + ": " + msg).join("\\n");
    }
  }
});
</script>
</body>
</html>
