<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skeleton-converter viewer</title>
<link rel="stylesheet" href="hud.css">
<style>
  :root { --bg: #0f0f0f; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="__RUNTIME_URL__"></script>
<script src="hud.js"></script>
<script>
"use strict";
// Skeleton: ?skeleton=<name>.json wins; otherwise the default baked into this
// shell at generation time. The first animation autoplays.
const SKELETON_URL = new URLSearchParams(location.search).get("skeleton")
  || "__DEFAULT_SKELETON__";
// The atlas name does not always mirror the JSON's (hero-pro.json ships with
// hero.atlas), so use the one resolved at generation time; the same-stem guess
// is only for an explicit ?skeleton= override, where the caller named a file
// this shell was not generated for. An empty default means the pane was built
// with no atlas at all, and guessing one prints a 404 HTML dump that buries
// the real reason.
const ATLAS_PARAM = new URLSearchParams(location.search).get("atlas");
const ATLAS_URL = ATLAS_PARAM || "__DEFAULT_ATLAS__"
  || (new URLSearchParams(location.search).get("skeleton")
      ? SKELETON_URL.replace(/\.json$/, ".atlas") : "");
const FIRST_ANIMATION = "__FIRST_ANIMATION__";

const canvas = document.getElementById("canvas");
if (!window.hud) {
  // A bundle written before the shared HUD existed: the two files sit beside
  // this page, so the message is actionable instead of a blank pane.
  document.body.insertAdjacentHTML("beforeend",
    '<p id="error" style="position:fixed;left:8px;bottom:8px;color:#ff7b7b">'
    + "hud.js is missing beside this viewer — rebuild the bundle.</p>");
  window.__loadError = "hud.js missing";
  throw new Error("hud.js missing");
}
const nodes = hud.mount({ title: "spine 4.2" });
hud.watchErrors(nodes);
const explorer = hud.explorer();
let state = null, skeleton = null;
// Playback speed. AnimationState.timeScale multiplies the delta the state is
// updated with, so the pose stays exact and only the clock scales — the same
// thing the compare shell's master clock does from outside.
let speedValue = 1;
hud.speed(nodes, (value) => { speedValue = value; if (state) state.timeScale = value; }, 1);

function showTracks(animStateData) {
  const names = animStateData.skeletonData.animations.map(a => a.name);
  hud.tracks(nodes, names, setAnimation, FIRST_ANIMATION);
  // Marking a button is not playing it: the pane autoplays its first
  // animation, and a rig sitting in the setup pose reads as a broken
  // conversion — the other two panes play themselves, this one has to be told.
  const first = names.includes(FIRST_ANIMATION) ? FIRST_ANIMATION : names[0];
  if (first) setAnimation(first);
}

function setAnimation(name) {
  hud.mark(nodes, name);
  state.setAnimation(0, name, true);
}

// Attachment explorer: the editor-equivalent control per slot. Lists every
// attachment any skin maps to the slot (keyed by slot index) plus "(none)".
// Some rigs (template dummies) leave color objects unequipped — setup is
// None and no attachment timeline equips them; this panel lets the user
// toggle them like the Spine Editor's slot checkboxes.
// The rows the explorer shows, built here because only this pane's runtime
// knows its slots. The compare shell asks for them (__attachmentRows) and draws
// them in its own sidebar, so the control exists whether this pane is embedded
// or opened alone.
function attachmentRows(skeleton) {
  const skins = skeleton.data.skins || [];
  const rows = [];
  skeleton.slots.forEach(slot => {
    const idx = slot.data.index;
    const names = new Set();
    skins.forEach(skin => {
      const map = skin.attachments && skin.attachments[idx];
      if (map) Object.keys(map).forEach(n => names.add(n));
    });
    if (!names.size) return;
    rows.push({
      name: slot.data.name,
      options: [...names].sort(),
      value: slot.attachment ? slot.attachment.name : "",
      onPick: (value) => slot.setAttachment(value
        ? skeleton.data.defaultSkin.getAttachment(idx, value) : null),
    });
  });
  return rows;
}

function showAttachments(skeleton) {
  window.__attachmentRows = () => attachmentRows(skeleton);
  hud.explorerRows(explorer, attachmentRows(skeleton));
}

new spine.SpineCanvas(canvas, {
  pathPrefix: "",
  webglConfig: { alpha: true },
  app: {
    loadAssets: (app) => {
      if (!SKELETON_URL || !SKELETON_URL.endsWith(".json")) {
        hud.fail(nodes, "No skeleton found. Open with ?skeleton=<name>.json");
        window.__loadError = "no skeleton url";
        return;
      }
      if (!ATLAS_URL) {
        // No atlas was shipped with this rig, so there is nothing to texture
        // the attachments with. Say that instead of asking for a file that
        // was never there, and let a compare shell see the pane is done.
        hud.fail(nodes, "No atlas for this rig — it was built without one, so "
          + "the poses animate but nothing is textured. Rebuild with the "
          + ".atlas and its page image.");
        window.__loadError = "no atlas";
        return;
      }
      app.assetManager.loadTextureAtlas(ATLAS_URL);
      app.assetManager.loadJson(SKELETON_URL);
    },
    initialize: (app) => {
      const assetManager = app.assetManager;
      const atlas = assetManager.get(ATLAS_URL);
      if (!atlas) {
        // loadAssets already explained a rig that shipped without an atlas;
        // hud.fail keeps the first reason, which is the specific one.
        window.__loadError = ATLAS_URL
          ? "atlas failed to load: " + ATLAS_URL : "no atlas was shipped";
        hud.fail(nodes, window.__loadError);
        return;
      }
      const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas));
      skeleton = new spine.Skeleton(json.readSkeletonData(assetManager.get(SKELETON_URL)));
      hud.setNote(nodes, SKELETON_URL);

      state = new spine.AnimationState(new spine.AnimationStateData(skeleton.data));
      state.timeScale = speedValue;
      state.apply(skeleton);
      skeleton.update(0);
      skeleton.updateWorldTransform(spine.Physics.update);
      // Debug handles: the verification rule in AGENTS.md samples these from a
      // running page to prove the rig animates. Keep the names stable.
      window.__skeleton = skeleton;
      window.__state = state;
      window.__renderer = app.renderer;

      const camera = app.renderer.camera;
      // Frame the rig from its real setup-pose bounds, from the LIVE canvas
      // size: the app sizes the drawing buffer after `init` runs (and the pane
      // can resize later), so a camera computed once here keeps whatever the
      // canvas measured at that moment — a default 300x150 buffer framed the
      // whole rig into a corner.
      //
      // The box and the margin come from hud.fitScale, the same call the
      // SkelForm pane makes, so the two panes cannot drift apart. The camera
      // convention is this viewer's own: `zoom` scales the viewport DOWN
      // (screen scale = 1/zoom in BACKING pixels), so the CSS-pixel scale is
      // divided by the device pixel ratio.
      window.__fit = () => {
        const offset = new spine.Vector2(), size = new spine.Vector2();
        // Measure the SETUP pose, exactly like the SkelForm pane does. A box
        // measured on whatever frame is on screen changes with the animation —
        // and with the clock, since a refit can land mid-playback — so two
        // panes that frame the same rig would still disagree by a few percent.
        skeleton.setToSetupPose();
        skeleton.updateWorldTransform(spine.Physics.update);
        skeleton.getBounds(offset, size);
        const cssWidth = Math.max(canvas.clientWidth, 1);
        const cssHeight = Math.max(canvas.clientHeight, 1);
        const dpr = canvas.width / cssWidth || 1;
        camera.position.set(offset.x + size.x / 2, offset.y + size.y / 2, 0);
        camera.zoom = 1 / (hud.fitScale(size.x, size.y, cssWidth, cssHeight) * dpr);
      };
      // The pane is laid out AFTER this runs, and the iframe's own resize event
      // can fire before the listener exists — so refit whenever the canvas
      // measures differently than the fit that is in place. Checking three
      // numbers per frame is cheaper than chasing the layout.
      let fittedSize = "";
      window.__fitIfResized = () => {
        const key = [canvas.clientWidth, canvas.clientHeight, canvas.width].join("x");
        if (key === fittedSize) return;
        fittedSize = key;
        window.__fit();
      };
      window.__fitIfResized();
      window.addEventListener("resize", () => window.__fitIfResized());

      showTracks(state.data);
      showAttachments(skeleton);
      // Premultiplied-alpha atlases (pma:true) need the flag on the renderer
      // or regions sample washed; non-PMA atlases (the default) are unchanged.
      // It is read from the atlas, NOT assumed: every exporter leaves fully
      // transparent pixels at a sprite's border carrying RGB, which is legal in
      // a non-premultiplied page and INVISIBLE under `SRC_ALPHA` blending — but
      // a premultiplied blend adds that RGB straight in and outlines every
      // attachment in white.
      app.renderer.premultipliedAlpha =
        (atlas.pages || []).some(p => p.pma);
    },
    update: (app, delta) => {
      if (state) {
        state.update(delta);
        state.apply(skeleton);
      }
      if (skeleton) {
        // Skeleton.update(delta) only advances the clock (this.time += delta).
        // The pose stays frozen in the world until updateWorldTransform runs,
        // so without this the rig renders a static setup pose while the
        // animation state happily advances.
        skeleton.update(delta);
        skeleton.updateWorldTransform(spine.Physics.update);
      }
    },
    render: (app) => {
      if (!skeleton) return;
      if (window.__fitIfResized) window.__fitIfResized();
      app.renderer.resize(spine.ResizeMode.Expand);
      const gl = app.renderer.context.gl;
      // The same #0f0f0f the SkelForm pane shows (its canvas clears to
      // transparent and the CSS `--bg` shows through) and the same black the
      // page itself uses: a different clear colour makes every background pixel
      // differ, which drowns any real difference in a pixel comparison.
      gl.clearColor(15 / 255, 15 / 255, 15 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      app.renderer.begin();
      // `drawSkeleton`'s second argument IS premultipliedAlpha: passing a
      // hard `true` here overrode the atlas-derived flag above and is what drew
      // the white attachment outlines this pane used to show.
      app.renderer.drawSkeleton(skeleton, app.renderer.premultipliedAlpha);
      app.renderer.end();
    },
    error: (app, errors) => {
      window.__loadError = Object.entries(errors)
        .map(([path, msg]) => path + ": " + msg).join("\n");
      hud.fail(nodes, window.__loadError);
    }
  }
});
</script>
</body>
</html>
