<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>skeleton-converter — Godot preview</title>
<link rel="stylesheet" href="hud.css">
<style>
  :root { --accent: #8db8d8; --engine: #478cbf; }
  body { margin: 0; background: #2b2b2b; color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #1a1c22;
            color: var(--muted); font: 13px var(--mono); z-index: 20; }
  #progress { width: 40%; height: 8px; border: 1px solid var(--border);
              border-radius: 999px; margin-top: 10px; overflow: hidden; }
  #progress-inner { height: 100%; width: 0; background: var(--engine); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status"><span id="status-notice">loading engine…</span>
  <div id="progress"><div id="progress-inner"></div></div></div>
<script src="__GODOT_RUNTIME_URL__"></script>
<script src="hud.js"></script>
<script>
"use strict";
// Boot config as generated by `godot --headless --export-release Web`
// (executable name, file sizes for the progress bar). The converter injects
// it from the engine's own index.html at build time.
const GODOT_CONFIG = __GODOT_CONFIG__;
const GODOT_THREADS_ENABLED = false;

if (!window.hud) {
  // A bundle written before the shared HUD existed: the two files sit beside
  // this page, so the message is actionable instead of a blank pane.
  document.body.insertAdjacentHTML("beforeend",
    '<p style="position:fixed;left:8px;bottom:8px;color:#ff7b7b">'
    + "hud.js is missing beside this viewer — rebuild the bundle.</p>");
  window.__loadError = "hud.js missing";
  throw new Error("hud.js missing");
}
const nodes = hud.mount({ title: "godot 4.7", note: "loading…" });
hud.watchErrors(nodes);
const explorer = hud.explorer();

// Animation tracks, filled by the boot script via window.previewAnims (called
// from GDScript once the scene's AnimationPlayer reports its list). Clicking a
// track calls window.previewPlay(name), which the scene wired to play it.
window.previewInspectData = function (_csv) { /* replaced by debug probes */ };
let attachmentRows = [];
window.__attachmentRows = () => attachmentRows;
window.previewAttachments = function (json) {
  // Attachment explorer, the Godot-side twin of the Spine viewer's panel: one
  // select per slot; choosing an attachment shows it and hides its slot
  // siblings, "(none)" hides the whole slot. The rows are built here (only this
  // side knows its slots) and drawn by the shared HUD; the compare shell asks
  // for the same rows and draws them in its sidebar.
  attachmentRows = JSON.parse(json).map(({ slot, attachments }) => {
    const options = attachments.slice().sort((a, b) =>
      a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    const visible = options.find((a) => a.visible);
    return {
      name: slot,
      options: options.map((a) => a.name),
      value: visible ? visible.name : "",
      onPick: (value) => {
        window.previewSetAttachment && window.previewSetAttachment(slot, value);
      },
    };
  });
  hud.explorerRows(explorer, attachmentRows);
  // Slots arrive after the engine boots, so the shell's sidebar has to redraw.
  try { window.top.__attachmentsChanged && window.top.__attachmentsChanged(); }
  catch (e) { /* standalone: the panel above is the only explorer */ }
};
window.previewAnims = function (csv) {
  const names = csv.split(",").filter(Boolean);
  hud.setNote(nodes, "click a track to play");
  hud.tracks(nodes, names, (name) => {
    window.previewPlay && window.previewPlay(name);
  }, names[0]);
};

const canvas = document.getElementById("canvas");
const engine = new Engine(GODOT_CONFIG);

function fail(text) {
  hud.fail(nodes, String(text));
  document.getElementById("status").style.display = "none";
}

engine.startGame({
  onProgress: (current, total) => {
    document.getElementById("progress-inner").style.width =
      Math.round((current / total) * 100) + "%";
  },
}).then(() => {
  document.getElementById("status").style.display = "none";
}).catch((err) => fail(err));
</script>
</body>
</html>
