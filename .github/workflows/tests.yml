name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The converter runs on a bare python3; pytest is the only test-time
      # tool, declared in pyproject's `dev` extra.
      - name: Install test runner
        run: python3 -m pip install --quiet "pytest>=8"

      # tests/fixtures/ holds third-party assets and is deliberately not
      # committed, so the fixture-based round-trip tests skip here. The
      # synthetic suite covers both adapters without any fixture.
      - name: Run tests
        run: python3 -m pytest tests/ -v

      # CLI end-to-end over a rig generated in code (tests/ci_rig.py), the
      # wired directions: spine -> godot -> spine, spine -> skelform ->
      # godot (the SkelForm bundle carries its page inside the archive), and
      # spine -> dragonbones -> spine. Everything lands in tmp/, which is gitignored. The Godot
      # web preview is not a CI dependency: the CLI catches the missing engine
      # and prints "web preview unavailable" while still writing the scene
      # (src/bundle.py, godot_preview.ExportError).
      - name: Convert every wired direction with the CLI
        run: |
          python3 -m tests.ci_rig build tmp/ci
          python3 -m src.cli convert --from spine --to godot tmp/ci/rig.json -o tmp/ci/godot
          python3 -m src.cli convert --from godot --to spine tmp/ci/godot/output/rig.tscn -o tmp/ci/spine
          python3 -m src.cli convert --from spine --to skelform tmp/ci/rig.json -o tmp/ci/skelform
          python3 -m src.cli convert --from skelform --to godot tmp/ci/skelform/output/rig.skf -o tmp/ci/skelform-godot
          python3 -m src.cli convert --from spine --to dragonbones tmp/ci/rig.json -o tmp/ci/dragonbones
          python3 -m src.cli convert --from dragonbones --to spine tmp/ci/dragonbones/output/rig_ske.json -o tmp/ci/dragonbones-spine
          python3 -m tests.ci_rig verify tmp/ci/godot tmp/ci/spine tmp/ci/skelform tmp/ci/dragonbones

      - name: Smoke-test the CLI
        run: |
          python3 -m src.cli --help
          python3 -m src.cli convert --help
