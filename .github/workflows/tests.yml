name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The converter itself is stdlib-only; pytest is the only test-time tool.
      - name: Install test runner
        run: python3 -m pip install --quiet pytest

      # tests/fixtures/ holds third-party assets and is deliberately not
      # committed, so the fixture-based round-trip tests skip here. The
      # synthetic suite covers both adapters without any fixture.
      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Smoke-test the CLI
        run: |
          python3 -m src.cli --help
          python3 -m src.cli convert --help
